# Courtland-Gleeson (Turquoise district), AZ — Cu skarn
# Adjacent district to Bisbee/Tombstone (Dragoon Mountains, Cochise County), same arid
# Sonoran setting. Cu skarn in Paleozoic carbonate rocks intruded by Laramide stocks —
# same deposit-genesis family as Bisbee. Second skarn-category expansion site.
#
# Finer geology (optional): AZGS OFR-20-02 GeoPackage
#   https://library.azgs.arizona.edu/item/AOFR-1603324919493-818
#   Download CourtlandGleeson_geopkg.zip → unzip into data/lithology/
#   Then: python scripts/lithology_matched_null.py --sites courtland_gleeson \
#     --geology-source azgs_local --geology-path data/lithology/<gpkg-name>.gpkg
# Optional YAML: lithology_source: azgs_local  (still pass --geology-path on the CLI)
id: courtland_gleeson
name: "Courtland-Gleeson, AZ"
bbox_wgs84: [-110.08, 31.67, -109.58, 32.11]
layout: nested

classification:
  low_pct: 70
  high_pct: 90
  strong_score_min: 3

temporal:
  start: "2010-01-01"
  end: "2023-12-31"
